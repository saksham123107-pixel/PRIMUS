format = 2

[effect]
id = "concat.capcut-filter-high-saturation"
name = "Anime Pop Vivid"
kind = "filter"
category = "Stylize"
order = 81
intensity = "vivid"
description = "CapCut's Japanese anime pop color grade with hyper-vivid saturation and crisp edges."

[[param]]
key = "vivid"
label = "Pop Intensity"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "boost"
label = "Color Saturation"
min = 100
max = 250
default = 160
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
