format = 2

[effect]
id = "concat.capcut-mirror-split"
name = "Mirror & Quad Split"
kind = "effect"
category = "Distort"
order = 24
intensity = "zoom"
description = "CapCut's popular symmetrical multi-screen mirror and 4-way kaleidoscope reflection effect."

[[param]]
key = "mode"
label = "Mode (1=H, 2=V, 3=Quad)"
min = 1
max = 3
default = 1
step = 1
unit = ""

[[param]]
key = "zoom"
label = "Zoom"
min = 50
max = 200
default = 100
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
