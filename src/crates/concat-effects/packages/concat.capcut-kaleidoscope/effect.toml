format = 2

[effect]
id = "concat.capcut-kaleidoscope"
name = "Hex Kaleidoscope"
kind = "effect"
category = "Distort"
order = 36
intensity = "segments"
description = "CapCut's 6-segment radial kaleidoscope mirror reflection effect."

[[param]]
key = "segments"
label = "Segments"
min = 4
max = 16
default = 6
step = 2
unit = ""

[[param]]
key = "rotation"
label = "Spin Speed"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
