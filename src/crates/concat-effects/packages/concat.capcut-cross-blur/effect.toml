format = 2

[effect]
id = "concat.capcut-cross-blur"
name = "Cross Streak Blur"
kind = "effect"
category = "Blur"
order = 54
intensity = "streak"
description = "CapCut's directional horizontal and vertical optical cross blur."

[[param]]
key = "streak"
label = "Streak Length"
min = 1
max = 30
default = 10
step = 1
unit = "px"

[[param]]
key = "brightness"
label = "Highlight Boost"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
