format = 2

[effect]
id = "concat.capcut-pixel-glitch"
name = "Pixel Mosh Glitch"
kind = "effect"
category = "Glitch"
order = 34
intensity = "mosh"
description = "CapCut's digital video data-mosh pixel tearing and horizontal slice displacement."

[[param]]
key = "mosh"
label = "Mosh Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "slices"
label = "Slice Count"
min = 5
max = 50
default = 20
step = 1
unit = ""

[wgsl]
entry = "effect.wgsl"
space = "display"
