format = 2

[effect]
id = "concat.capcut-anamorphic-flare"
name = "Anamorphic Flare"
kind = "effect"
category = "Cinematic"
order = 27
intensity = "brightness"
description = "CapCut's cinematic horizontal blue anamorphic streak lens flare across bright specular highlights."

[[param]]
key = "brightness"
label = "Brightness"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "threshold"
label = "Threshold"
min = 50
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "spread"
label = "Streak Length"
min = 10
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
