format = 2

[effect]
id = "concat.capcut-edge-glow"
name = "Cyber Edge Glow"
kind = "effect"
category = "Stylize"
order = 22
intensity = "glow"
description = "CapCut's iconic neon edge detection outline with electric glow and vibrant color selection."

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "threshold"
label = "Threshold"
min = 1
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "hue"
label = "Neon Hue"
min = 0
max = 360
default = 180
step = 1
unit = "deg"

[wgsl]
entry = "effect.wgsl"
space = "display"
