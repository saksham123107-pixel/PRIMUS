format = 2

[effect]
id = "concat.capcut-vhs-tape-tear"
name = "VHS Tape Glitch Tear"
kind = "effect"
category = "Retro"
order = 46
intensity = "tear"
description = "CapCut's retro magnetic VCR tracking noise bar and horizontal tape tear."

[[param]]
key = "tear"
label = "Tear Width"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Roll Speed"
min = 1
max = 15
default = 3
step = 1
unit = ""

[wgsl]
entry = "effect.wgsl"
space = "display"
