format = 2

[effect]
id = "concat.capcut-filter-polaroid-600"
name = "Instant Polaroid 600"
kind = "filter"
category = "Retro"
order = 78
intensity = "polaroid"
description = "CapCut's instant film camera washed contrast and warm olive-yellow faded tones."

[[param]]
key = "polaroid"
label = "Polaroid Grade"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "fade_amt"
label = "Faded Shadow"
min = 0
max = 50
default = 20
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
