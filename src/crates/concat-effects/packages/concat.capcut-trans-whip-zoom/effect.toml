format = 2

[effect]
id = "concat.capcut-trans-whip-zoom"
name = "Whip Zoom Cut"
kind = "transition"
category = "Zoom"
order = 70
description = "CapCut's viral rapid zoom-in into outgoing clip and explosive zoom-out of incoming clip."

[[param]]
key = "zoom_speed"
label = "Zoom Scale"
min = 1
max = 50
default = 25
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
