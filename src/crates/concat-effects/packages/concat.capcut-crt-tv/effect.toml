format = 2

[effect]
id = "concat.capcut-crt-tv"
name = "Retro CRT TV"
kind = "effect"
category = "Retro"
order = 26
intensity = "scanlines"
description = "CapCut's retro cathode-ray tube TV filter with curved screen bulge, horizontal scanlines, and RGB phosphor triad."

[[param]]
key = "scanlines"
label = "Scanlines"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "curve"
label = "Curvature"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[[param]]
key = "jitter"
label = "Roll Jitter"
min = 0
max = 100
default = 20
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
