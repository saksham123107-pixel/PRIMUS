format = 2

[effect]
id = "concat.capcut-sparkle-stars"
name = "Bling Star Glint"
kind = "effect"
category = "Light"
order = 45
intensity = "glint"
description = "CapCut's viral bling cross-star glitter sparkles on specular highlights."

[[param]]
key = "glint"
label = "Glint Brightness"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "threshold"
label = "Threshold"
min = 60
max = 100
default = 85
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
