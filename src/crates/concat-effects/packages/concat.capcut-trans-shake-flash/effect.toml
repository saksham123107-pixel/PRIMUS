format = 2

[effect]
id = "concat.capcut-trans-shake-flash"
name = "Shake & Flash"
kind = "transition"
category = "Camera"
order = 70
description = "CapCut's signature cut: the frame shakes hard while a white strobe flashes across the seam."

[[param]]
key = "shake"
label = "Shake"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "flash"
label = "Flash"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
